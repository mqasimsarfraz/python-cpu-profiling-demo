apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-profile-load-generator
  namespace: cpu-profile-demo
  labels:
    app.kubernetes.io/name: cpu-profile-load-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-profile-load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpu-profile-load-generator
        app.kubernetes.io/component: load-generator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load-generator
          image: ghcr.io/mqasimsarfraz/python-cpu-profiling-demo:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.loadgen
          env:
            - name: TARGET_URL
              value: http://cpu-profile-demo/analyze?size=5000
            - name: PAUSE_SECONDS
              value: "0.05"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
