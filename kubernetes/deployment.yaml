apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-profile-demo
  namespace: cpu-profile-demo
  labels:
    app.kubernetes.io/name: cpu-profile-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-profile-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpu-profile-demo
        app.kubernetes.io/component: application
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: ghcr.io/mqasimsarfraz/python-cpu-profiling-demo:latest
          imagePullPolicy: Always
          env:
            - name: IMPLEMENTATION
              value: slow
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
